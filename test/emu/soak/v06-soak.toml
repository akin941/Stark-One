# STARK-0606 (ROADMAP V0.6) on the test image, whose stark_subghz_transport is the test-only
# fake CC1101 (ADR-0022 §3): 60 s of emulated use of the whole Sub-GHz module, two passes of
#   detect (the CC1101 module appears and answers) -> RSSI meter (the level moves) -> the module
#   pulled and plugged back (the app falls to its home list, the chip is found and identified
#   again) -> band scan (the carrier's channel) -> capture of the pulse-width scene "pwm24"
#   (192 symbols, fingerprint 0x78a82ac5 as scripts/gen_subghz_vectors.py computes it) -> save
#   (rf_0001.rf, then rf_0002.rf) -> read the file back and decode it (pwm, 24 bits, x4) -> a
#   confirmed replay (exactly one transmission) -> a second replay at once, refused for the
#   off-time (`subghz: tx refused: offtime`, an alert) -> back to the launcher.
# The first replay is 28 s after boot, so the 18 s boot lock has run out; the second pass's
# is 54 s after boot and 26 s after the last transmission. Nothing is ever sent without an OK
# on the dialog: forbid_between / forbid_after pin one transmission per confirmation and none
# before it. The 8.4 kB recording the fake keeps of what GDO0 carries is given back after each
# transmission (nothing listens: emu_sg_own_rx is 0), so the first-versus-last heap gate means
# what it did in the earlier soaks. The scenario ends idle at the launcher so stark_diag's last
# line (~61 s) is taken at the root menu, as the first one was.
# Gates: drops=0 on every diag line and root heap within 1 kB. The esp-emulator-soak job runs
# it. Integration evidence, not RF: no signal exists behind any of it (ROADMAP V1 exit 12).
name = "emu-v06-soak"
image = "storage"
end_ms = 62500
wall_limit_s = 1500
heap_min = 200000
heap_delta_max = 1024
pokes = [
    { at_ms = 500, var = "emu_mod_slot0", value = 32 },   # the CC1101 module's EEPROM in slot 0
    { at_ms = 500, var = "emu_sg_chip", value = 1 },   # a CC1101 answers
    { at_ms = 500, var = "emu_sg_carrier_khz", value = 433920 },   # the air: one carrier at 433.920 MHz ...
    { at_ms = 500, var = "emu_sg_level", value = -40 },   # ... at -40 dBm
    { at_ms = 500, var = "emu_sg_scene", value = 1 },   # GDO2 plays the pulse-width scene each time the chip enters RX
    { at_ms = 7500, var = "emu_sg_level", value = -70 },   # the meter follows: -70 dBm
    { at_ms = 8300, var = "emu_sg_level", value = -55 },   # -55 dBm
    { at_ms = 9300, var = "emu_mod_slot0", value = 0 },   # the module is pulled: the app falls back to its home list
    { at_ms = 12100, var = "emu_mod_slot0", value = 32 },   # plugged back in: found, claimed and identified again
    { at_ms = 31600, var = "emu_sg_level", value = -40 },   # the air is back at -40 dBm for the next pass
    { at_ms = 33600, var = "emu_sg_level", value = -70 },   # the meter follows: -70 dBm
    { at_ms = 34400, var = "emu_sg_level", value = -55 },   # -55 dBm
    { at_ms = 35400, var = "emu_mod_slot0", value = 0 },   # the module is pulled: the app falls back to its home list
    { at_ms = 38200, var = "emu_mod_slot0", value = 32 },   # plugged back in: found, claimed and identified again
]
