# One transmission per confirmation, and none before it: between a file being opened and its
# confirmation nothing reaches GDO0, and after a transmission the same file is never sent again.
forbid_between = [
    { after = "subghzapp: opened rf_0001.rf", before = "subghzapp: tx confirmed rf_0001.rf", text = "subghz: tx rf_" },
    { after = "subghzapp: opened rf_0001.rf", before = "subghzapp: tx confirmed rf_0001.rf", text = "subghzapp: sent" },
