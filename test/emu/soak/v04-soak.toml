# STARK-0405 (ROADMAP V0.4) on the storage test image with the fake PN532
# transport (ADR-0020 §3) and the RMT loopback: 60 s of emulated use — the
# NFC app polling while 10 tags arrive and leave (every emulator catalogue
# tag, a vanishing one included), two confirmed writes, two dumps saved, a
# bus-error burst that loses the module and its recovery — then an IR replay
# and a 100 kB write test, and idle at the launcher so stark_diag's last
# line (~61 s) is taken at the root menu, as the first one was. Gates:
# drops=0 on every diag line and root heap within 1 kB. The esp-emulator-soak
# job runs it. Integration evidence only — no RF, no real tags.
name = "emu-v04-soak"
image = "storage"
end_ms = 62900
wall_limit_s = 1500
heap_min = 200000
heap_delta_max = 1024
rmt_loopback = "0:2"
pokes = [
    { at_ms = 1600, var = "emu_nfc_tag", value = 1 },  # NTAG213
    { at_ms = 2400, var = "emu_nfc_tag", value = 0 },
    { at_ms = 3100, var = "emu_nfc_tag", value = 2 },  # NTAG215
    { at_ms = 6100, var = "emu_nfc_tag", value = 0 },
    { at_ms = 6900, var = "emu_nfc_tag", value = 4 },  # NTAG213
    { at_ms = 7700, var = "emu_nfc_tag", value = 0 },
    { at_ms = 8400, var = "emu_nfc_tag", value = 5 },  # ULTRALIGHT
    { at_ms = 11400, var = "emu_nfc_tag", value = 0 },
    { at_ms = 12100, var = "emu_nfc_tag", value = 3 },  # CLASSIC_1K
    { at_ms = 13900, var = "emu_nfc_tag", value = 0 },
    { at_ms = 14600, var = "emu_nfc_tag", value = 1 },  # NTAG213
    { at_ms = 16700, var = "emu_nfc_tag", value = 0 },
    { at_ms = 17400, var = "emu_nfc_tag", value = 6 },  # ISO_DEP
    { at_ms = 18200, var = "emu_nfc_tag", value = 0 },
    { at_ms = 18900, var = "emu_nfc_tag", value = 1 },  # NTAG213
    { at_ms = 19700, var = "emu_nfc_tag", value = 0 },
    { at_ms = 20400, var = "emu_nfc_tag", value = 2 },  # NTAG215
    { at_ms = 21200, var = "emu_nfc_tag", value = 0 },
    { at_ms = 21900, var = "emu_nfc_tag", value = 7 },  # NTAG213
    { at_ms = 22700, var = "emu_nfc_tag", value = 0 },
    { at_ms = 23400, var = "emu_nfc_fault", value = 2 },  # bus errors
    { at_ms = 24900, var = "emu_nfc_fault", value = 0 },
]
presses = [
    { key = "UP", at_ms = 300, hold_ms = 60 },  # Storage
    { key = "UP", at_ms = 400, hold_ms = 60 },  # Settings
    { key = "UP", at_ms = 500, hold_ms = 60 },  # Modules (STARK-0505)
    { key = "UP", at_ms = 600, hold_ms = 60 },  # UART (STARK-0705): the new row, between Sub-GHz and Modules
    { key = "UP", at_ms = 700, hold_ms = 60 },  # NFC (Lab: IR 13, NFC 14)
    { key = "OK", at_ms = 900, hold_ms = 60 },
    { key = "OK", at_ms = 3900, hold_ms = 60 },  # Write URI
    { key = "OK", at_ms = 4200, hold_ms = 60 },  # https://example.com/stark
    { key = "OK", at_ms = 4600, hold_ms = 60 },  # confirm
    { key = "OK", at_ms = 9200, hold_ms = 60 },  # Write URI
    { key = "OK", at_ms = 9500, hold_ms = 60 },  # https://example.com/stark
    { key = "OK", at_ms = 9900, hold_ms = 60 },  # confirm
    { key = "OK", at_ms = 12900, hold_ms = 60 },  # Save dump
