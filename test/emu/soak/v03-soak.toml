# STARK-0307 (ROADMAP V0.3) on the storage test image with esp-emu's RMT
# loopback (`--rmt-loopback 0:2`, ADR-0019 §2): 60 s of emulated use of
# everything V0.3 added — the IR app open with RX on, ten confirmed replays
# across every seeded protocol (each >= 1 s apart, the transmit interval),
# two captures saved and one replayed, browse three times, App Test's IR
# self-test once (7 frames) — plus V0.2 activity (a 100 kB write test,
# Settings changed and restored), then idle at the launcher so stark_diag's
# last line (~61 s) is taken at the root menu, as the first one was. Gates:
# drops=0 on every diag line (always) and the first and last stark_diag heap
# within 1 kB. Outside the default set (test/emu/soak/); the
# esp-emulator-soak job runs it. Baseband only — no optical claim.
name = "emu-v03-soak"
image = "storage"
end_ms = 62500
wall_limit_s = 1500
heap_min = 200000
heap_delta_max = 1024
rmt_loopback = "0:2"
presses = [
    { key = "UP", at_ms = 300, hold_ms = 60 },  # Storage
    { key = "UP", at_ms = 420, hold_ms = 60 },  # Settings
    { key = "UP", at_ms = 540, hold_ms = 60 },  # NFC (STARK-0404)
    { key = "UP", at_ms = 660, hold_ms = 60 },  # IR
    { key = "OK", at_ms = 800, hold_ms = 60 },
    { key = "DOWN", at_ms = 1100, hold_ms = 60 },  # Browse saved
    { key = "OK", at_ms = 1300, hold_ms = 60 },  # 9 files, on lab_nec.ir
    { key = "OK", at_ms = 1800, hold_ms = 60 },  # replay 1: lab_nec.ir
    { key = "OK", at_ms = 2200, hold_ms = 60 },  # confirm
    { key = "DOWN", at_ms = 3000, hold_ms = 60 },
    { key = "OK", at_ms = 3500, hold_ms = 60 },  # replay 2: lab_necx.ir
    { key = "OK", at_ms = 3900, hold_ms = 60 },  # confirm
    { key = "DOWN", at_ms = 4700, hold_ms = 60 },
    { key = "OK", at_ms = 5200, hold_ms = 60 },  # replay 3: lab_raw.ir
    { key = "OK", at_ms = 5600, hold_ms = 60 },  # confirm
    { key = "DOWN", at_ms = 6400, hold_ms = 60 },
    { key = "OK", at_ms = 6900, hold_ms = 60 },  # replay 4: lab_rc5.ir
    { key = "OK", at_ms = 7300, hold_ms = 60 },  # confirm
    { key = "DOWN", at_ms = 8100, hold_ms = 60 },
    { key = "OK", at_ms = 8600, hold_ms = 60 },  # replay 5: lab_rc6.ir
    { key = "OK", at_ms = 9000, hold_ms = 60 },  # confirm
    { key = "DOWN", at_ms = 9800, hold_ms = 60 },
    { key = "OK", at_ms = 10300, hold_ms = 60 },  # replay 6: lab_sirc12.ir
    { key = "OK", at_ms = 10700, hold_ms = 60 },  # confirm
    { key = "DOWN", at_ms = 11500, hold_ms = 60 },
    { key = "OK", at_ms = 12000, hold_ms = 60 },  # replay 7: lab_sirc15.ir
    { key = "OK", at_ms = 12400, hold_ms = 60 },  # confirm
    { key = "DOWN", at_ms = 13200, hold_ms = 60 },
    { key = "OK", at_ms = 13700, hold_ms = 60 },  # replay 8: lab_sirc20.ir
    { key = "OK", at_ms = 14100, hold_ms = 60 },  # confirm
    { key = "BACK", at_ms = 15000, hold_ms = 60 },  # receive view
    { key = "OK", at_ms = 15300, hold_ms = 60 },  # Save last -> ir_0001.ir (SIRC20)
    { key = "DOWN", at_ms = 15800, hold_ms = 60 },
    { key = "OK", at_ms = 16000, hold_ms = 60 },  # 10 files, on ir_0001.ir
    { key = "OK", at_ms = 16500, hold_ms = 60 },  # replay 9: ir_0001.ir
    { key = "OK", at_ms = 16900, hold_ms = 60 },  # confirm
    { key = "DOWN", at_ms = 17700, hold_ms = 60 },  # lab_nec (lab_bad skipped)
    { key = "OK", at_ms = 18000, hold_ms = 60 },  # replay 10: lab_nec.ir
    { key = "OK", at_ms = 18400, hold_ms = 60 },  # confirm
    { key = "BACK", at_ms = 19200, hold_ms = 60 },  # receive view
    { key = "OK", at_ms = 19500, hold_ms = 60 },  # Save last -> ir_0002.ir (NEC)
    { key = "BACK", at_ms = 20000, hold_ms = 60 },  # leave IR: RX off
    { key = "UP", at_ms = 20400, hold_ms = 60 },
    { key = "UP", at_ms = 20550, hold_ms = 60 },
    { key = "UP", at_ms = 20700, hold_ms = 60 },
    { key = "UP", at_ms = 20850, hold_ms = 60 },
    { key = "UP", at_ms = 21000, hold_ms = 60 },  # App Test
    { key = "OK", at_ms = 21300, hold_ms = 60 },
    { key = "UP", at_ms = 21600, hold_ms = 60 },  # wraps to IR self-test
    { key = "OK", at_ms = 21800, hold_ms = 60 },
    { key = "OK", at_ms = 22100, hold_ms = 60 },  # confirm: 7 frames
    { key = "BACK", at_ms = 36000, hold_ms = 60 },  # leave App Test
    { key = "UP", at_ms = 36400, hold_ms = 60 },
    { key = "UP", at_ms = 36550, hold_ms = 60 },
    { key = "UP", at_ms = 36700, hold_ms = 60 },  # wraps to Storage
    { key = "OK", at_ms = 37000, hold_ms = 60 },
    { key = "DOWN", at_ms = 37300, hold_ms = 60 },
    { key = "DOWN", at_ms = 37500, hold_ms = 60 },
    { key = "OK", at_ms = 37800, hold_ms = 60 },  # write test
    { key = "BACK", at_ms = 41000, hold_ms = 60 },
    { key = "UP", at_ms = 41300, hold_ms = 60 },  # Settings
    { key = "OK", at_ms = 41600, hold_ms = 60 },
    { key = "LEFT", at_ms = 41900, hold_ms = 60 },  # brightness down
    { key = "RIGHT", at_ms = 42300, hold_ms = 60 },  # and back
    { key = "BACK", at_ms = 42800, hold_ms = 60 },
]
expect = [
    "storage: mounted emu-flashfat",
    "ir: rx on",
    "app: start ir",
    "irapp: browse 9 files",
    "irapp: sent lab_nec.ir",
    "irapp: sent lab_necx.ir",
    "irapp: sent lab_raw.ir",
    "irapp: sent lab_rc5.ir",
    "irapp: sent lab_rc6.ir",
    "irapp: sent lab_sirc12.ir",
    "irapp: sent lab_sirc15.ir",
    "irapp: sent lab_sirc20.ir",
    "ir: rx SIRC20 addr=0x1A5 cmd=0x33",
    "irapp: saved ir_0001.ir",
    "irapp: browse 10 files",
    "irapp: sent ir_0001.ir",
    "irapp: sent lab_nec.ir",
    "ir: rx NEC addr=0x00 cmd=0x12",
    "irapp: saved ir_0002.ir",
    "ir: rx off",
    "app: stop ir",
    "app: start apptest",
    'dialog: open "Transmit IR test frames?"',
    "apptest: ir self-test done 7/7",
    "app: stop apptest",
    "app: start storage",
    "storageapp: wtest ok bytes=102400",
    "app: stop storage",
    "app: start settings",
    "app: stop settings",
]
forbid = ["irapp: send refused", "irapp: send failed", "irapp: save failed", "ir: tx failed",
          "mismatch", "timeout", "wtest failed", "storage: unusable"]
