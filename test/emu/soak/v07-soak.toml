    { at_ms = 80350, var = "emu_lab_wire", value = 0 },   # the wire is removed
    { at_ms = 82950, var = "emu_lab_ext_pin", value = 39 },   # the external source moves to pad 39
    { at_ms = 82960, var = "emu_lab_ext_hz", value = 1000 },   # 1 kHz
    { at_ms = 82970, var = "emu_lab_ext_duty", value = 25 },   # 25 %
    { at_ms = 82980, var = "emu_lab_ext_mode", value = 3 },   # a square wave
    { at_ms = 86750, var = "emu_lab_ext_mode", value = 0 },   # the source is off
    { at_ms = 89750, var = "emu_mod_slot0", value = 34 },   # a SPI breakout appears in slot 0 while pin 40 is an output
    { at_ms = 105850, var = "emu_mod_slot0", value = 32 },   # the breakout is swapped for the CC1101 module
    { at_ms = 111450, var = "emu_mod_slot0", value = 0 },   # the module is pulled
    { at_ms = 111500, var = "emu_lab_uart", value = 1 },   # TX looped to RX
    { at_ms = 114750, var = "emu_lab_uart", value = 3 },   # the text scene
    { at_ms = 119850, var = "emu_lab_uart", value = 0 },   # the peer falls silent (a talking peer would also drive pad 39 in the next GPIO measurement)
]
