# STARK-0708 (ROADMAP V0.7 exit) on the test image, whose stark_lab_transport is the test-only pad, bus, SPI and UART
# model (ADR-0023 §2): about 120 s of emulated use of every V0.7 tool through the real apps and services, two passes of
#   Self-Test (Run all, the walk answered with the injected keys, one report exported) -> GPIO (pin 38 an output behind its
#   confirmation, a toggle against a short injected on the pad = a contention, an alert and hi-Z; PWM behind a new confirmation
#   with pad 38 wired to pad 39, the model's own check of the wire, a stop, a pulse; pin 39 measuring an external 1 kHz 25 %
#   source; pin 40 an output when a SPI breakout appears in slot 0 and withdraws it) -> I2C (the scan lists the five
#   devices and the module's EEPROM, one confirmed write to 0x68, a write to the module EEPROM at 0x50 refused) -> SPI (one
#   confirmed JEDEC read on the breakout, then the module is swapped for the CC1101 module and the probe refuses the slot:
#   owned by Sub-GHz) -> UART (the loopback test behind the TX confirmation, then the monitor logging the 1 300-byte scene to
#   uart_000N.log with its CRC-32) -> the module pulled and the peer silent, ready for the next pass.
# The plan said 60 s; the full sequence needs about 60 s a pass at the key spacing the existing scenarios proved (ADR-0023,
# 0708 addendum point 6). The PN532 is switched off (emu_nfc_fault = 1) so the scan lists known devices and NFC is dimmed,
# which is why the launcher walks skip the dimmed NFC row (every walk was read from real menu: sel= lines). The launcher and a view's list go back to
# their first row when the module table or the view changes, so the keys count from the top (as in the earlier scenarios).
# The scenario ends idle at the launcher so stark_diag's last line (~121 s) is taken at the root menu, as the first one was.
# Gates: drops=0 on every diag line and root heap within 1 kB. The esp-emulator-soak-run job runs it. Integration evidence,
# not a pad, a wire or a device: nothing here shows a level on a pin (ROADMAP V1 exit 13, docs/bringup/v1-labtools.md).
name = "emu-v07-soak"
image = "storage"
end_ms = 122500
wall_limit_s = 3600
heap_min = 200000
heap_delta_max = 1024
pokes = [
    { at_ms = 300, var = "emu_nfc_fault", value = 1 },   # the PN532 is gone: 0x24 NACKs, so the scan lists the known devices
    { at_ms = 310, var = "emu_lab_spi", value = 1 },   # a JEDEC flash behind the SPI breakout's chip select
    { at_ms = 320, var = "emu_sg_chip", value = 1 },   # a CC1101 answers once its module is fitted
    { at_ms = 14100, var = "emu_lab_ext_pin", value = 38 },   # the external source is on pad 38
    { at_ms = 14200, var = "emu_lab_ext_mode", value = 2 },   # pad 38 is shorted to ground from outside
    { at_ms = 15800, var = "emu_lab_ext_mode", value = 0 },   # the short is removed
    { at_ms = 16500, var = "emu_lab_wire", value = 2471 },   # pad 38 into pad 39 (38 * 64 + 39)
    { at_ms = 20400, var = "emu_lab_wire", value = 0 },   # the wire is removed
    { at_ms = 23000, var = "emu_lab_ext_pin", value = 39 },   # the external source moves to pad 39
    { at_ms = 23010, var = "emu_lab_ext_hz", value = 1000 },   # 1 kHz
    { at_ms = 23020, var = "emu_lab_ext_duty", value = 25 },   # 25 %
    { at_ms = 23030, var = "emu_lab_ext_mode", value = 3 },   # a square wave
    { at_ms = 26800, var = "emu_lab_ext_mode", value = 0 },   # the source is off
    { at_ms = 29800, var = "emu_mod_slot0", value = 34 },   # a SPI breakout appears in slot 0 while pin 40 is an output
    { at_ms = 45900, var = "emu_mod_slot0", value = 32 },   # the breakout is swapped for the CC1101 module
    { at_ms = 51500, var = "emu_mod_slot0", value = 0 },   # the module is pulled
    { at_ms = 51550, var = "emu_lab_uart", value = 1 },   # TX looped to RX
    { at_ms = 54800, var = "emu_lab_uart", value = 3 },   # the text scene
    { at_ms = 59900, var = "emu_lab_uart", value = 0 },   # the peer falls silent (a talking peer would also drive pad 39 in the next GPIO measurement)
    { at_ms = 74050, var = "emu_lab_ext_pin", value = 38 },   # the external source is on pad 38
    { at_ms = 74150, var = "emu_lab_ext_mode", value = 2 },   # pad 38 is shorted to ground from outside
