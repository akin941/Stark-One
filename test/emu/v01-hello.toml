# STARK-0104: the hello app — added in one new directory plus one registry
# line in main/ (ADR-0016) — is listed, launches (under Examples: UP from
# About wraps to the last row, Storage; then Settings, NFC, IR, Hello), refreshes its uptime once a
# second on the production image, and leaves cleanly.
name = "emu-v01-hello"
end_ms = 3800
heap_min = 200000
presses = [
    { key = "UP", at_ms = 300, hold_ms = 60 },     # from About, wrap to Storage
    { key = "UP", at_ms = 420, hold_ms = 60 },     # Settings
    { key = "UP", at_ms = 540, hold_ms = 60 },     # past the Device header to NFC
    { key = "UP", at_ms = 660, hold_ms = 60 },     # IR
    { key = "UP", at_ms = 780, hold_ms = 60 },     # past the Lab header to Hello
    { key = "OK", at_ms = 950, hold_ms = 60 },
    { key = "BACK", at_ms = 3400, hold_ms = 60 },
]
expect = [
    "app: registry n=11 about,diagnostics,inputtest,displaytest,buzzertest,apptest,hello,nfc,ir,storage,settings",
    'menu: sel=9 "Hello"',
    "hello: uptime=00:00:01",    # on_start (launched ~1 s in), before the launch is logged
    "app: start hello",
    "hello: uptime=00:00:02",    # the once-a-second refresh, twice
    "hello: uptime=00:00:03",
    "app: stop hello",
]
