# STARK-0105 (ROADMAP V0.1 exit 2): the modal confirm dialog on the
# production image, through App Test (row 5: three DOWNs from About). Cancel
# with BACK, confirm with OK — which opens a "Done" alert from the confirm's
# result — then an alert closed with OK. The held-key rule and the overlay
# pixels are asserted on the host UI port (test/host/test_ui_dialog.c).
name = "emu-v01-dialog"
end_ms = 3750
heap_min = 200000
presses = [
    { key = "DOWN", at_ms = 300, hold_ms = 60 },     # About -> Diagnostics
    { key = "DOWN", at_ms = 450, hold_ms = 60 },     # -> Self-Test (row 3, STARK-0707)
    { key = "DOWN", at_ms = 600, hold_ms = 60 },     # -> App Test (row 5)
    { key = "OK", at_ms = 750, hold_ms = 60 },
    { key = "OK", at_ms = 1050, hold_ms = 60 },
    { key = "BACK", at_ms = 1350, hold_ms = 60 },
    { key = "OK", at_ms = 1650, hold_ms = 60 },
    { key = "OK", at_ms = 1950, hold_ms = 60 },
    { key = "OK", at_ms = 2250, hold_ms = 60 },
    { key = "DOWN", at_ms = 2550, hold_ms = 60 },
    { key = "OK", at_ms = 2750, hold_ms = 60 },
    { key = "OK", at_ms = 3050, hold_ms = 60 },
    { key = "BACK", at_ms = 3350, hold_ms = 60 },
]
expect = [
    'menu: sel=5 "App Test"',
    "app: start apptest",
    'dialog: open "Confirm"',
    "dialog: cancel",
    "apptest: cancelled",
    'dialog: open "Confirm"',
    "dialog: ok",
    "apptest: confirmed",
    'dialog: open "Done"',
    "dialog: ok",
    "apptest: done closed",
    'menu: sel=1 "Alert dialog"',
    'dialog: open "Alert"',
    "dialog: ok",
    "apptest: alert closed",
    "app: stop apptest",
]
