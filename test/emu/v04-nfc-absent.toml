# STARK-0404 and STARK-0505 on the production image (ROADMAP V0.4 exit 3, software
# half): esp-emu has no PN532, so detection finds no module, the NFC capability is
# never confirmed and the launcher dims the row: walking UP from About skips it
# (Storage, Settings, Modules, then IR 11) and the app can never start, so no RF
# field. The app's own no-module screen stays covered by test_ui_nfc.c and by a
# module lost while it is open (storage/v04-nfc-app).
name = "emu-v04-nfc-absent"
end_ms = 2500
heap_min = 200000
presses = [
    { key = "UP", at_ms = 400, hold_ms = 60 },     # Storage
    { key = "UP", at_ms = 550, hold_ms = 60 },     # Settings
    { key = "UP", at_ms = 700, hold_ms = 60 },     # Modules
    { key = "UP", at_ms = 850, hold_ms = 60 },     # IR: NFC 12 is dimmed, skipped
    { key = "DOWN", at_ms = 1000, hold_ms = 60 },  # back past it to Modules
]
expect = [
    "nfc: no module (Not found)",
    "module: caps 0x00000003",
    'menu: sel=14 "Modules"',
    'menu: sel=11 "IR"',
    'menu: sel=14 "Modules"',
]
forbid = ['menu: sel=12 "NFC"', "app: start nfc", "nfc: field on", "nfc: tag", "nfcapp: confirm"]
