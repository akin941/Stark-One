# STARK-0207 on the production image (ROADMAP V0.2 exit 4, software half):
# esp-emu models no SD card, so this boot has none — and every app is still
# reachable and works: About, Diagnostics, App Test, Buzzer Test, Display
# Test, Input Test, Hello, Settings (a value changed and changed back,
# committed) and Storage (shows no card; the write test refuses). No drops,
# heap above the gate.
