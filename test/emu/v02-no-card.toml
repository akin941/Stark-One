# STARK-0207 on the production image (ROADMAP V0.2 exit 4, software half):
# esp-emu models no SD card, so this boot has none — and every app is still
# reachable and works: About, Diagnostics, Self-Test (home only: no card, the export is not pressed), App Test, Buzzer Test, Display
# Test, Input Test, Hello, IR (receiving), Modules, Settings (a value changed and
# changed back, committed) and Storage (shows no card; the write test refuses). No drops,
# heap above the gate. NFC is dimmed with no reader, so the walk skips it (STARK-0505).
name = "emu-v02-no-card"
