# STARK-0704 on the test image (ADR-0023 §5, §9): the I2C app over the pad model's bus (the fifth
# substitution), whose five devices answer at 0x23, 0x3C, 0x48, 0x68 and 0x76. The fake PN532 is
# switched off (emu_nfc_fault = 1) so the scan finds exactly the five; without that switch the same
# bus also shows 0x24, which belongs to the NFC fake (storage/v07-i2c-bus). The 0x68 register file
# answers WHO_AM_I (0x75) with 0x68. A write of 0x01 to register 0x6b asks a confirmation naming
# the address, the register and the bytes: BACK on it writes nothing and arms nothing, a second
# confirmation arms exactly that one write, and a second look at the register (the editor keeps
# the register) reads 0x01 back. Integration evidence for the rules and the log lines; the model is
# spec-derived and nothing here shows a device on a wire (docs/VALIDATION.md §2).
name = "emu-v07-i2c"
image = "storage"
end_ms = 15230
heap_min = 200000
