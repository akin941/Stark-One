]
expect = [
    "lab: pins 38 39 40 41 42",
    'menu: sel=13 "I2C"',
    "i2capp: home",
    "app: start i2c",
    "lab: i2c scan found 0x23 0x3c 0x48 0x68 0x76",
    "i2capp: scan 5 found",
    "i2capp: open 0x68",
    "lab: i2c read 0x68 reg 0x75 68",
    "i2capp: read 0x68 reg 0x75 len 1: 68",
    "i2capp: confirm write 0x68",
    'dialog: open "Write 0x68?"',
    "dialog: cancel",
    "i2capp: cancelled write 0x68",
    "i2capp: confirm write 0x68",
    'dialog: open "Write 0x68?"',
