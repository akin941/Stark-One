    { after = "i2capp: open 0x68", before = "i2capp: cancelled write 0x68", text = "lab: i2c write 0x68" },
    { after = "i2capp: cancelled write 0x68", before = "dialog: ok", text = "lab: i2c write 0x68" },
]
