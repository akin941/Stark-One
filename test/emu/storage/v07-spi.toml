# STARK-0706 on the test image (ADR-0023 §6, §9): the SPI probe on a module slot. Catalogue entry
# 34 (emu_mod_slot0 = 34, `SPI breakout`, descriptor 0x00000008: MOD_SPI and no function bit) is in
# slot 0 and the test-only SPI device is a JEDEC flash (emu_lab_spi = 1); the module table accepts a
# descriptor after two identical reads a second apart, so the app is opened 2.5 s in. The app opens the slot,
# the JEDEC ID preset asks a confirmation naming slot, clock, mode and bytes; BACK sends nothing,
# OK makes exactly one transaction (`lab: spi slot 0 1 MHz mode 0 tx 9f 00 00 00 rx 00 ef 40 18`),
# the lease ("spiprobe") is claimed and released inside it, and a second press asks again. The
# device becomes an echo (emu_lab_spi = 2): MISO is MOSI delayed by one byte. Then the module is
# swapped for the CC1101 module (entry 32, `owned by Sub-GHz`): the Sub-GHz driver claims the slot
# and identifies its chip as before (the fake CC1101 answers, caps 0x27), the probe refuses the slot
# with an alert and never claims it (forbid_after), and with the slot empty (`no module`) it
# refuses again. A raw SPI transfer never reaches a radio: ADR-0022's transmit policy stays the
# only way to the transmitter. Integration evidence; the SPI device model is spec-derived and
# nothing here shows a signal on a pin (docs/VALIDATION.md §2, ROADMAP V1 exit 13).
name = "emu-v07-spi"
image = "storage"
end_ms = 19200
heap_min = 200000
pokes = [
    { at_ms = 300, var = "emu_mod_slot0", value = 34 },  # a SPI breakout in slot 0
    { at_ms = 300, var = "emu_lab_spi", value = 1 },  # a JEDEC flash behind its chip select
    { at_ms = 300, var = "emu_sg_chip", value = 1 },  # a CC1101 will answer once its module is fitted
    { at_ms = 9500, var = "emu_lab_spi", value = 2 },  # an echo instead
    { at_ms = 11300, var = "emu_mod_slot0", value = 32 },  # the module is swapped for the CC1101 module
    { at_ms = 15300, var = "emu_mod_slot0", value = 0 },  # and pulled
]
presses = [
    { key = "UP", at_ms = 2540, hold_ms = 60 },  # Storage
    { key = "UP", at_ms = 2680, hold_ms = 60 },  # Settings
    { key = "UP", at_ms = 2820, hold_ms = 60 },  # Modules
    { key = "UP", at_ms = 2960, hold_ms = 60 },  # UART
    { key = "UP", at_ms = 3100, hold_ms = 60 },  # SPI (Sub-GHz is dimmed without a radio module)
    { key = "OK", at_ms = 3770, hold_ms = 60 },  # open the app
    { key = "OK", at_ms = 4300, hold_ms = 60 },  # Slot 0: SPI breakout: the setup
    { key = "DOWN", at_ms = 4600, hold_ms = 60 },  # Clock, Mode, 3 presets, Bytes, Nibble, Byte 0-3, Send (1 of 11)
    { key = "DOWN", at_ms = 4740, hold_ms = 60 },  # Clock, Mode, 3 presets, Bytes, Nibble, Byte 0-3, Send (2 of 11)
    { key = "DOWN", at_ms = 4880, hold_ms = 60 },  # Clock, Mode, 3 presets, Bytes, Nibble, Byte 0-3, Send (3 of 11)
    { key = "DOWN", at_ms = 5020, hold_ms = 60 },  # Clock, Mode, 3 presets, Bytes, Nibble, Byte 0-3, Send (4 of 11)
    { key = "DOWN", at_ms = 5160, hold_ms = 60 },  # Clock, Mode, 3 presets, Bytes, Nibble, Byte 0-3, Send (5 of 11)
    { key = "DOWN", at_ms = 5300, hold_ms = 60 },  # Clock, Mode, 3 presets, Bytes, Nibble, Byte 0-3, Send (6 of 11)
    { key = "DOWN", at_ms = 5440, hold_ms = 60 },  # Clock, Mode, 3 presets, Bytes, Nibble, Byte 0-3, Send (7 of 11)
    { key = "DOWN", at_ms = 5580, hold_ms = 60 },  # Clock, Mode, 3 presets, Bytes, Nibble, Byte 0-3, Send (8 of 11)
    { key = "DOWN", at_ms = 5720, hold_ms = 60 },  # Clock, Mode, 3 presets, Bytes, Nibble, Byte 0-3, Send (9 of 11)
    { key = "DOWN", at_ms = 5860, hold_ms = 60 },  # Clock, Mode, 3 presets, Bytes, Nibble, Byte 0-3, Send (10 of 11)
    { key = "DOWN", at_ms = 6000, hold_ms = 60 },  # Clock, Mode, 3 presets, Bytes, Nibble, Byte 0-3, Send (11 of 11)
    { key = "OK", at_ms = 6300, hold_ms = 60 },  # Send: the confirmation opens
    { key = "BACK", at_ms = 6800, hold_ms = 60 },  # cancel: nothing is sent
    { key = "OK", at_ms = 7300, hold_ms = 60 },  # Send again: it asks again
    { key = "OK", at_ms = 7800, hold_ms = 60 },  # confirm: one transaction, the JEDEC ID
    { key = "UP", at_ms = 8300, hold_ms = 60 },  # the answer is in view; back to Send
    { key = "OK", at_ms = 8700, hold_ms = 60 },  # a second press asks again
    { key = "BACK", at_ms = 9200, hold_ms = 60 },  # cancel
    { key = "OK", at_ms = 9800, hold_ms = 60 },  # Send, the echo device now
    { key = "OK", at_ms = 10300, hold_ms = 60 },  # confirm: one transaction, MISO is MOSI delayed by a byte
    { key = "BACK", at_ms = 10900, hold_ms = 60 },  # setup -> home
    { key = "OK", at_ms = 14500, hold_ms = 60 },  # Slot 0 now holds the CC1101 module: refused with an alert
    { key = "OK", at_ms = 15000, hold_ms = 60 },  # close the alert
    { key = "OK", at_ms = 17500, hold_ms = 60 },  # Slot 0 is empty: refused with an alert
    { key = "OK", at_ms = 18000, hold_ms = 60 },  # close the alert
    { key = "BACK", at_ms = 18500, hold_ms = 60 },  # leave the app
]
expect = [
    "module: slot 0 SPI breakout id=0x0b01 rev=1 caps=0x00000008",
    "spiapp: home",
    "app: start spi",
    "spiapp: open slot 0",
    "spiapp: confirm slot 0 1 MHz mode 0",
    'dialog: open "Send SPI?"',
    "dialog: cancel",
    "spiapp: cancelled slot 0",
    "spiapp: confirm slot 0 1 MHz mode 0",
    "dialog: ok",
    "module: slot 0 claimed by spiprobe",
    "lab: spi slot 0 1 MHz mode 0 tx 9f 00 00 00 rx 00 ef 40 18",
    "spiapp: sent slot 0: rx 00 ef 40 18",
    "spiapp: confirm slot 0 1 MHz mode 0",
    "dialog: cancel",
    "spiapp: confirm slot 0 1 MHz mode 0",
    "dialog: ok",
    "lab: spi slot 0 1 MHz mode 0 tx 9f 00 00 00 rx 00 9f 00 00",
    "spiapp: sent slot 0: rx 00 9f 00 00",
    "module: slot 0 CC1101 433 MHz id=0x0a01 rev=1 caps=0x00000038",
    "module: slot 0 claimed by subghz",
    "subghz: cc1101 version 0x14",
    "module: caps 0x00000027",
    "spiapp: slot 0 refused: owned by Sub-GHz",
    'dialog: open "No probe"',
    "spiapp: slot 0 refused: no module",
    "app: stop spi",
]
forbid = [
    "lab: spi slot 0 1 MHz mode 0 tx 9f 00 00 00 failed",
    "spiapp: send slot 0 failed",
    "lab: spi send refused",
    "lab: spi request refused",
    "slot 0 busy",
    "panic",
]
# A cancelled dialog made no transaction, and the radio's slot was never claimed by the probe.
forbid_between = [
    { after = "spiapp: cancelled slot 0", before = "dialog: ok", text = "lab: spi slot" },
]
forbid_after = [
    { after = "module: slot 0 claimed by subghz", text = "claimed by spiprobe" },
    { after = "module: slot 0 claimed by subghz", text = "lab: spi slot 0 1 MHz" },
]
