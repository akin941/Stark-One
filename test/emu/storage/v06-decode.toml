# STARK-0604 on the test image, whose stark_subghz_transport is the test-only fake CC1101
# (ADR-0022 §3). The CC1101 module (catalogue entry 32) is in slot 0 and answers; with
# `emu_sg_scene = 2` GDO2 plays the spec-derived pulse-distance scene "ppm24" (24 bits
# 0x5A3CC3, 400 us pulses, 400/1200 us gaps, four repeats after 8 ms of silence:
# scripts/gen_subghz_vectors.py) each time the receiver starts. The production service, app and
# UI run unchanged: Sub-GHz -> Capture -> Start -> Stop (200 symbols), then the Decode row opens
# the read-only analysis, whose reading the app also logs: kind, the measured short and long us,
# the bit count, the bits as hex and how many bursts repeated them. The capture is saved, and
# Saved -> rf_0001.rf -> Decode reads the file back through the same decoders: the same line.
# Receive only: nothing is transmitted and nothing on the analysis view can send. The pulse-width
# and Manchester scenes are decoded on the host (test_subghz_decode, test_ui_subghz) against the
# same generator. Integration evidence, not RF: no signal exists behind any of it (ROADMAP V1
# exit 12).
name = "emu-v06-decode"
image = "storage"
end_ms = 25200
heap_min = 200000
pokes = [
    { at_ms = 500, var = "emu_mod_slot0", value = 32 },
    { at_ms = 500, var = "emu_sg_chip", value = 1 },
    { at_ms = 500, var = "emu_sg_scene", value = 2 },   # the pulse-distance scene
]
presses = [
    { key = "UP", at_ms = 5300, hold_ms = 60 },      # Storage
    { key = "UP", at_ms = 5500, hold_ms = 60 },      # Settings
    { key = "UP", at_ms = 5700, hold_ms = 60 },      # Modules
    { key = "UP", at_ms = 5900, hold_ms = 60 },  # UART (STARK-0705): the new row, between Sub-GHz and Modules
    { key = "UP", at_ms = 6100, hold_ms = 60 },      # Sub-GHz
    { key = "OK", at_ms = 6500, hold_ms = 60 },
    { key = "DOWN", at_ms = 7200, hold_ms = 60 },    # Band scan
    { key = "DOWN", at_ms = 7500, hold_ms = 60 },    # Capture
    { key = "OK", at_ms = 7800, hold_ms = 60 },      # the setup: Frequency, Modulation, Start
    { key = "DOWN", at_ms = 8500, hold_ms = 60 },
    { key = "DOWN", at_ms = 8800, hold_ms = 60 },    # Start
    { key = "OK", at_ms = 9100, hold_ms = 60 },      # captures the scene
    { key = "OK", at_ms = 11200, hold_ms = 60 },     # Stop
    { key = "DOWN", at_ms = 12200, hold_ms = 60 },   # Capture again
    { key = "DOWN", at_ms = 12500, hold_ms = 60 },   # Decode
    { key = "OK", at_ms = 12800, hold_ms = 60 },     # the analysis
    { key = "BACK", at_ms = 14200, hold_ms = 60 },   # the finished capture again
    { key = "OK", at_ms = 15200, hold_ms = 60 },     # Save: rf_0001.rf
    { key = "BACK", at_ms = 16700, hold_ms = 60 },   # capture -> home (the radio idles)
    { key = "DOWN", at_ms = 17200, hold_ms = 60 },
    { key = "DOWN", at_ms = 17500, hold_ms = 60 },
    { key = "DOWN", at_ms = 17800, hold_ms = 60 },   # Saved
    { key = "OK", at_ms = 18200, hold_ms = 60 },     # the list: rf_0001.rf
    { key = "OK", at_ms = 19200, hold_ms = 60 },     # reads it back
    { key = "OK", at_ms = 20700, hold_ms = 60 },     # Decode, the first row of the file view
    { key = "BACK", at_ms = 22200, hold_ms = 60 },   # analysis -> file
    { key = "BACK", at_ms = 22700, hold_ms = 60 },   # file -> list
    { key = "BACK", at_ms = 23200, hold_ms = 60 },   # list -> home
    { key = "BACK", at_ms = 23700, hold_ms = 60 },   # home -> launcher
]
expect = [
    "subghz: cc1101 version 0x14",
    'menu: sel=16 "Sub-GHz"',
    "app: start subghz",
    "subghz: capture start 433.920 MHz ook",
    "subghzapp: capture 200 sym",
    "subghzapp: decode 4 bursts, 4 decoded, 0 unknown",
    "subghzapp: ppm short=400 long=1200 bits=24 hex=5a3cc3 x4",
    "subghzapp: saved rf_0001.rf (200 sym)",
    "subghzapp: opened rf_0001.rf (200 sym)",
    "subghzapp: decode 4 bursts, 4 decoded, 0 unknown",
    "subghzapp: ppm short=400 long=1200 bits=24 hex=5a3cc3 x4",
    "app: stop subghz",
]
forbid = ["module not usable", "subghz init failed", "save failed", "save refused", "open failed",
          "capture refused", "decode failed", "panic", "app: fault"]
