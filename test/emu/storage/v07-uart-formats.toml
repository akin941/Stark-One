# STARK-0705 on the test image (ADR-0023 §7): the loopback bridge in every format of the list (8N1,
# 8E1, 8O1, 8N2, 7E1) at 115 200, through the real service and app over the pad model's UART peer wired
# TX to RX (emu_lab_uart = 1). Each run sends the 64-byte pattern 00..3f and reads it back whole with no
# error: 64/64 ok. A change of format installs the driver again with TX still routed, so the
# confirmation of the TX pin is asked once. Integration evidence for the rules and the log lines (the
# peer is spec-derived); nothing here shows a format on a wire (docs/VALIDATION.md §2).
name = "emu-v07-uart-formats"
image = "storage"
end_ms = 11600
heap_min = 200000
pokes = [
    { at_ms = 400, var = "emu_lab_uart", value = 1 },  # TX looped to RX
]
presses = [
    { key = "UP", at_ms = 500, hold_ms = 60 },  # Storage
    { key = "UP", at_ms = 650, hold_ms = 60 },  # Settings
    { key = "UP", at_ms = 800, hold_ms = 60 },  # Modules
    { key = "UP", at_ms = 950, hold_ms = 60 },  # UART
    { key = "OK", at_ms = 1400, hold_ms = 60 },  # open the app
    { key = "DOWN", at_ms = 1900, hold_ms = 60 },  # Send
    { key = "DOWN", at_ms = 2050, hold_ms = 60 },  # Loopback test
    { key = "OK", at_ms = 2200, hold_ms = 60 },  # the view
    { key = "OK", at_ms = 2700, hold_ms = 60 },  # Run test: the confirmation first
    { key = "OK", at_ms = 3200, hold_ms = 60 },  # confirm: 115 200 8N1
    { key = "DOWN", at_ms = 3900, hold_ms = 60 },  # Baud
    { key = "DOWN", at_ms = 4050, hold_ms = 60 },  # Format
    { key = "RIGHT", at_ms = 4200, hold_ms = 60 },  # 8E1
