    { key = "UP", at_ms = 4500, hold_ms = 60 },  # Run test
    { key = "OK", at_ms = 4700, hold_ms = 60 },  # 115 200 8E1
    { key = "DOWN", at_ms = 5200, hold_ms = 60 },  # Baud
    { key = "DOWN", at_ms = 5350, hold_ms = 60 },  # Format
    { key = "RIGHT", at_ms = 5500, hold_ms = 60 },  # 8O1
    { key = "UP", at_ms = 5650, hold_ms = 60 },  # Baud
    { key = "UP", at_ms = 5800, hold_ms = 60 },  # Run test
    { key = "OK", at_ms = 6000, hold_ms = 60 },  # 115 200 8O1
    { key = "DOWN", at_ms = 6500, hold_ms = 60 },  # Baud
    { key = "DOWN", at_ms = 6650, hold_ms = 60 },  # Format
    { key = "RIGHT", at_ms = 6800, hold_ms = 60 },  # 8N2
    { key = "UP", at_ms = 6950, hold_ms = 60 },  # Baud
    { key = "UP", at_ms = 7100, hold_ms = 60 },  # Run test
