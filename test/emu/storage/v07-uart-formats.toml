    { key = "UP", at_ms = 8400, hold_ms = 60 },  # Run test
    { key = "OK", at_ms = 8600, hold_ms = 60 },  # 115 200 7E1
    { key = "BACK", at_ms = 9100, hold_ms = 60 },  # leave the view
    { key = "BACK", at_ms = 9600, hold_ms = 60 },  # leave the app
]
expect = [
    "lab: uart open 115200 8N1",
    'dialog: open "Drive LAB_UART_TX?"',
    "lab: uart tx on",
    "lab: uart loop 64/64 ok",
    "lab: uart open 115200 8E1",
    "lab: uart loop 64/64 ok",
    "lab: uart open 115200 8O1",
    "lab: uart loop 64/64 ok",
    "lab: uart open 115200 8N2",
