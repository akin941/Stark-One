    { key = "LEFT", at_ms = 7580, hold_ms = 60 },  # Duty 50 % down to 25 % (25 of 25)
    { key = "DOWN", at_ms = 7710, hold_ms = 60 },  # Start
    { key = "OK", at_ms = 8010, hold_ms = 60 },  # Start: the confirmation opens
    { key = "OK", at_ms = 8510, hold_ms = 60 },  # confirm: armed, 1 kHz at 25 % on pad 38
    { key = "OK", at_ms = 9710, hold_ms = 60 },  # Stop (no confirmation)
    { key = "UP", at_ms = 10210, hold_ms = 60 },  # Mode (1 of 3)
    { key = "UP", at_ms = 10510, hold_ms = 60 },  # Mode (2 of 3)
    { key = "UP", at_ms = 10810, hold_ms = 60 },  # Mode (3 of 3)
    { key = "RIGHT", at_ms = 11110, hold_ms = 60 },  # Mode: Pulse
    { key = "DOWN", at_ms = 11410, hold_ms = 60 },  # Level, Width, Pulse (1 of 3)
    { key = "DOWN", at_ms = 11710, hold_ms = 60 },  # Level, Width, Pulse (2 of 3)
    { key = "DOWN", at_ms = 12010, hold_ms = 60 },  # Level, Width, Pulse (3 of 3)
    { key = "OK", at_ms = 12310, hold_ms = 60 },  # one pulse, 100 us low (armed, no dialog)
    { key = "UP", at_ms = 13010, hold_ms = 60 },  # Width
    { key = "RIGHT", at_ms = 13310, hold_ms = 60 },  # 1 ms
    { key = "DOWN", at_ms = 13610, hold_ms = 60 },  # Pulse
    { key = "OK", at_ms = 13910, hold_ms = 60 },  # one pulse, 1 ms low
    { key = "OK", at_ms = 14710, hold_ms = 60 },  # a pulse into a transport fault -> the alert, hi-Z
    { key = "OK", at_ms = 15410, hold_ms = 60 },  # close the alert
    { key = "BACK", at_ms = 16010, hold_ms = 60 },  # release pin 38
    { key = "BACK", at_ms = 16510, hold_ms = 60 },  # leave the app
]
pokes = [
    { at_ms = 400, var = "emu_lab_wire", value = 2471 },  # pad 38's output is the source of pad 39 (38 * 64 + 39)
    { at_ms = 14610, var = "emu_lab_fault", value = 3 },  # the pad model fails its next configuration
    { at_ms = 15910, var = "emu_lab_fault", value = 0 },  # the fault is cleared
]
expect = [
    "lab: pins 38 39 40 41 42",
    'menu: sel=12 "GPIO"',
    "app: start gpio",
    "gpioapp: open pin 38 LAB_UART_TX",
    'dialog: open "Drive pin 38?"',
    "lab: armed pin 38",
    "lab: wire 38 -> 39 edges=4 high=25%",
    "lab: pwm pin 38 1000 Hz 25 %",
    "gpioapp: pin 38 PWM",
    "lab: pwm stopped",
    "gpioapp: pin 38 Hi-Z",
    "lab: pulse pin 38 low 100 us",
    "lab: pulse pin 38 low 1000 us",
    'dialog: open "Contention"',
    "lab: released all",
    "app: stop gpio",
]
forbid = [
    "lab init failed",
    "gpio: conflict",
    "panic",
]
# The PWM waited for its confirmation, and the pulses and the stop needed none.
forbid_between = [
    { after = "lab: armed pin 38", before = "lab: released all", text = 'dialog: open "Drive pin 38?"' },
    { after = "gpioapp: open pin 38", before = 'dialog: open "Drive pin 38?"', text = "lab: pwm pin" },
]
