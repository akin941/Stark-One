# STARK-0702 on the test image (ADR-0023 §4, §9): PWM and pulse over the test-only pad model.
# The pad model has no LEDC (esp-emu routes none to a pad, docs/VALIDATION.md §2), so the
# duty and frequency arithmetic is proven on the host (test_lab_pwm) and this scenario shows what
# the emulator can: the confirmation comes before the PWM, the request reaches the pad model as
# 1 kHz at 25 %, and with pad 38 wired to pad 39 (emu_lab_wire = 38 * 64 + 39) the model's own
# check samples pad 39 over four periods and logs `lab: wire 38 -> 39 edges=4 high=25%`. Stop
# needs no confirmation; a pulse is one pulse per key press with no second dialog (the pin is
# armed); a pad-model fault (emu_lab_fault = 3, CONFIG_ERROR) turns the next pulse into an alert and hi-Z.
name = "emu-v07-gpio-pwm"
image = "storage"
end_ms = 17810
heap_min = 200000
presses = [
    { key = "DOWN", at_ms = 400, hold_ms = 60 },  # About -> Diagnostics, Self-Test, App Test, Buzzer, Display, Input, Hello, GPIO (1 of 8)
    { key = "DOWN", at_ms = 620, hold_ms = 60 },  # About -> Diagnostics, Self-Test, App Test, Buzzer, Display, Input, Hello, GPIO (2 of 8)
    { key = "DOWN", at_ms = 840, hold_ms = 60 },  # About -> Diagnostics, Self-Test, App Test, Buzzer, Display, Input, Hello, GPIO (3 of 8)
    { key = "DOWN", at_ms = 1060, hold_ms = 60 },  # About -> Diagnostics, Self-Test, App Test, Buzzer, Display, Input, Hello, GPIO (4 of 8)
    { key = "DOWN", at_ms = 1280, hold_ms = 60 },  # About -> Diagnostics, Self-Test, App Test, Buzzer, Display, Input, Hello, GPIO (5 of 8)
    { key = "DOWN", at_ms = 1500, hold_ms = 60 },  # About -> Diagnostics, Self-Test, App Test, Buzzer, Display, Input, Hello, GPIO (6 of 8)
    { key = "DOWN", at_ms = 1720, hold_ms = 60 },  # About -> Diagnostics, Self-Test, App Test, Buzzer, Display, Input, Hello, GPIO (7 of 8)
    { key = "DOWN", at_ms = 1940, hold_ms = 60 },  # About -> Diagnostics, Self-Test, App Test, Buzzer, Display, Input, Hello, GPIO (8 of 8)
    { key = "OK", at_ms = 2160, hold_ms = 60 },  # open the app
    { key = "OK", at_ms = 2560, hold_ms = 60 },  # open pin 38
    { key = "RIGHT", at_ms = 2960, hold_ms = 60 },  # Mode: Input, Output, PWM (1 of 3)
    { key = "RIGHT", at_ms = 3260, hold_ms = 60 },  # Mode: Input, Output, PWM (2 of 3)
    { key = "RIGHT", at_ms = 3560, hold_ms = 60 },  # Mode: Input, Output, PWM (3 of 3)
    { key = "DOWN", at_ms = 3860, hold_ms = 60 },  # Freq, Duty (1 of 2)
    { key = "DOWN", at_ms = 4160, hold_ms = 60 },  # Freq, Duty (2 of 2)
    { key = "LEFT", at_ms = 4460, hold_ms = 60 },  # Duty 50 % down to 25 % (1 of 25)
    { key = "LEFT", at_ms = 4590, hold_ms = 60 },  # Duty 50 % down to 25 % (2 of 25)
    { key = "LEFT", at_ms = 4720, hold_ms = 60 },  # Duty 50 % down to 25 % (3 of 25)
    { key = "LEFT", at_ms = 4850, hold_ms = 60 },  # Duty 50 % down to 25 % (4 of 25)
    { key = "LEFT", at_ms = 4980, hold_ms = 60 },  # Duty 50 % down to 25 % (5 of 25)
    { key = "LEFT", at_ms = 5110, hold_ms = 60 },  # Duty 50 % down to 25 % (6 of 25)
    { key = "LEFT", at_ms = 5240, hold_ms = 60 },  # Duty 50 % down to 25 % (7 of 25)
    { key = "LEFT", at_ms = 5370, hold_ms = 60 },  # Duty 50 % down to 25 % (8 of 25)
    { key = "LEFT", at_ms = 5500, hold_ms = 60 },  # Duty 50 % down to 25 % (9 of 25)
    { key = "LEFT", at_ms = 5630, hold_ms = 60 },  # Duty 50 % down to 25 % (10 of 25)
    { key = "LEFT", at_ms = 5760, hold_ms = 60 },  # Duty 50 % down to 25 % (11 of 25)
    { key = "LEFT", at_ms = 5890, hold_ms = 60 },  # Duty 50 % down to 25 % (12 of 25)
    { key = "LEFT", at_ms = 6020, hold_ms = 60 },  # Duty 50 % down to 25 % (13 of 25)
    { key = "LEFT", at_ms = 6150, hold_ms = 60 },  # Duty 50 % down to 25 % (14 of 25)
    { key = "LEFT", at_ms = 6280, hold_ms = 60 },  # Duty 50 % down to 25 % (15 of 25)
    { key = "LEFT", at_ms = 6410, hold_ms = 60 },  # Duty 50 % down to 25 % (16 of 25)
    { key = "LEFT", at_ms = 6540, hold_ms = 60 },  # Duty 50 % down to 25 % (17 of 25)
    { key = "LEFT", at_ms = 6670, hold_ms = 60 },  # Duty 50 % down to 25 % (18 of 25)
    { key = "LEFT", at_ms = 6800, hold_ms = 60 },  # Duty 50 % down to 25 % (19 of 25)
    { key = "LEFT", at_ms = 6930, hold_ms = 60 },  # Duty 50 % down to 25 % (20 of 25)
    { key = "LEFT", at_ms = 7060, hold_ms = 60 },  # Duty 50 % down to 25 % (21 of 25)
    { key = "LEFT", at_ms = 7190, hold_ms = 60 },  # Duty 50 % down to 25 % (22 of 25)
    { key = "LEFT", at_ms = 7320, hold_ms = 60 },  # Duty 50 % down to 25 % (23 of 25)
