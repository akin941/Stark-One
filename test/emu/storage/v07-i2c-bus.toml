# STARK-0704 on the test image (ADR-0023 §5, §9): one bus. A module (emu_mod_slot0 = 1, an NFC
# carrier with an ID EEPROM) puts the 24C02 of the fake module transport at 0x50, and the fake PN532
# answers at 0x24 (both are asked through their own transports), so one scan shows
# 0x23 0x24 0x3c 0x48 0x50 0x68 0x76. NFC is confirmed, so reading the PN532 is refused by the
# service (`nfc reader`: not even a status read, and no write either, the NFC driver owns the
# protocol), and a write to the module's ID EEPROM is refused (`module eeprom`: a descriptor is
# never written), each with an alert, no confirmation and no bus traffic. A dump of 0x68 asks first
# (BACK touches nothing), then makes 16
# transactions of 16. A stuck bus (emu_lab_i2c_fault = 3) ends the sweep after three probes with
# `Bus error` and no hang, and a rescan after it is cleared finds everything again. Integration
# evidence; the model is spec-derived (docs/VALIDATION.md §2).
