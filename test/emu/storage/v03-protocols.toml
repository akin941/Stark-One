# STARK-0307 (ROADMAP V0.3 exit 1, software half — the loopback half) on the
# storage test image with esp-emu's RMT loopback (`--rmt-loopback 0:2`,
# ADR-0019 §2): every seeded protocol file (NEC, NECX, RAW, RC5, RC6,
# SIRC-12/15/20) is browsed, confirmed, parsed, gated, sent through RMT TX
# and received back by the IR app's own receiver with identical fields.
# The >= 20 vectors per protocol are the host half (test_ir_*). Baseband
# only: no carrier, LED, light or receiver is proven (V1 checks).
name = "emu-v03-protocols"
image = "storage"
end_ms = 16800
heap_min = 200000
rmt_loopback = "0:2"
presses = [
    { key = "UP", at_ms = 300, hold_ms = 60 },  # Storage
    { key = "UP", at_ms = 420, hold_ms = 60 },  # Settings
    { key = "UP", at_ms = 540, hold_ms = 60 },  # NFC (STARK-0404)
    { key = "UP", at_ms = 660, hold_ms = 60 },  # IR
    { key = "OK", at_ms = 800, hold_ms = 60 },
    { key = "DOWN", at_ms = 1100, hold_ms = 60 },  # Browse saved
    { key = "OK", at_ms = 1300, hold_ms = 60 },  # 9 files
    { key = "OK", at_ms = 1800, hold_ms = 60 },  # lab_nec.ir
    { key = "OK", at_ms = 2200, hold_ms = 60 },  # confirm
    { key = "DOWN", at_ms = 3000, hold_ms = 60 },
    { key = "OK", at_ms = 3500, hold_ms = 60 },  # lab_necx.ir
    { key = "OK", at_ms = 3900, hold_ms = 60 },  # confirm
    { key = "DOWN", at_ms = 4700, hold_ms = 60 },
    { key = "OK", at_ms = 5200, hold_ms = 60 },  # lab_raw.ir
    { key = "OK", at_ms = 5600, hold_ms = 60 },  # confirm
    { key = "DOWN", at_ms = 6400, hold_ms = 60 },
    { key = "OK", at_ms = 6900, hold_ms = 60 },  # lab_rc5.ir
    { key = "OK", at_ms = 7300, hold_ms = 60 },  # confirm
    { key = "DOWN", at_ms = 8100, hold_ms = 60 },
    { key = "OK", at_ms = 8600, hold_ms = 60 },  # lab_rc6.ir
    { key = "OK", at_ms = 9000, hold_ms = 60 },  # confirm
    { key = "DOWN", at_ms = 9800, hold_ms = 60 },
    { key = "OK", at_ms = 10300, hold_ms = 60 },  # lab_sirc12.ir
    { key = "OK", at_ms = 10700, hold_ms = 60 },  # confirm
    { key = "DOWN", at_ms = 11500, hold_ms = 60 },
    { key = "OK", at_ms = 12000, hold_ms = 60 },  # lab_sirc15.ir
    { key = "OK", at_ms = 12400, hold_ms = 60 },  # confirm
    { key = "DOWN", at_ms = 13200, hold_ms = 60 },
    { key = "OK", at_ms = 13700, hold_ms = 60 },  # lab_sirc20.ir
    { key = "OK", at_ms = 14100, hold_ms = 60 },  # confirm
    { key = "BACK", at_ms = 15600, hold_ms = 60 },  # list -> view
    { key = "BACK", at_ms = 16000, hold_ms = 60 },  # leave the app
]
expect = [
    "storage: mounted emu-flashfat",
    "app: start ir",
    "irapp: browse 9 files",
    "irapp: confirm lab_nec.ir: ",
    "ir: tx NEC addr=0x00 cmd=0x12 carrier=38000",
    "irapp: sent lab_nec.ir",
    "ir: rx NEC addr=0x00 cmd=0x12",
    "irapp: confirm lab_necx.ir: ",
    "ir: tx NECX addr=0x1234 cmd=0x56 carrier=38000",
    "irapp: sent lab_necx.ir",
    "ir: rx NECX addr=0x1234 cmd=0x56",
    "irapp: confirm lab_raw.ir: ",
    "ir: tx RAW n=13 carrier=38000",
    "irapp: sent lab_raw.ir",
    "ir: rx RAW n=13",
    "irapp: confirm lab_rc5.ir: ",
    "ir: tx RC5 addr=0x05 cmd=0x35 carrier=36000",
    "irapp: sent lab_rc5.ir",
    "ir: rx RC5 addr=0x05 cmd=0x35",
    "irapp: confirm lab_rc6.ir: ",
    "ir: tx RC6 addr=0x10 cmd=0x20 carrier=36000",
    "irapp: sent lab_rc6.ir",
    "ir: rx RC6 addr=0x10 cmd=0x20",
    "irapp: confirm lab_sirc12.ir: ",
    "ir: tx SIRC12 addr=0x01 cmd=0x15 carrier=40000",
    "irapp: sent lab_sirc12.ir",
    "ir: rx SIRC12 addr=0x01 cmd=0x15",
    "irapp: confirm lab_sirc15.ir: ",
    "ir: tx SIRC15 addr=0x42 cmd=0x2A carrier=40000",
    "irapp: sent lab_sirc15.ir",
    "ir: rx SIRC15 addr=0x42 cmd=0x2A",
    "irapp: confirm lab_sirc20.ir: ",
    "ir: tx SIRC20 addr=0x1A5 cmd=0x33 carrier=40000",
    "irapp: sent lab_sirc20.ir",
    "ir: rx SIRC20 addr=0x1A5 cmd=0x33",
    "ir: rx off",
    "app: stop ir",
]
forbid = ["irapp: send refused", "irapp: send failed", "ir: tx failed", "irapp: sent lab_bad.ir"]
# nothing is transmitted before the first confirmation
forbid_between = [
    { after = "app: start ir", before = "dialog: ok", text = "ir: tx " },
]
