# STARK-0102: the production image launches Display Test — now drawing the
# Latin-1/Turkish sample in both fonts every frame — keeps refreshing, and
# leaves cleanly. The pixels are checked on the host UI test port
# (test/host/test_ui_displaytest.c); here the point is that the new font
# tables run on the target without faults.
name = "emu-v01-displaytest"
end_ms = 3600
heap_min = 200000
presses = [
    { key = "DOWN", at_ms = 400, hold_ms = 60 },   # About -> Diagnostics
    { key = "DOWN", at_ms = 600, hold_ms = 60 },   # -> Self-Test (row 3, STARK-0707)
    { key = "DOWN", at_ms = 800, hold_ms = 60 },   # -> App Test (row 5)
    { key = "DOWN", at_ms = 1000, hold_ms = 60 },  # -> Buzzer Test
    { key = "DOWN", at_ms = 1200, hold_ms = 60 },  # -> Display Test (row 7)
    { key = "OK", at_ms = 1400, hold_ms = 60 },
    { key = "BACK", at_ms = 3200, hold_ms = 60 },
]
expect = [
    'menu: sel=7 "Display Test"',
    "app: start displaytest",
    "displaytest: fps=",
    "app: stop displaytest",
]
