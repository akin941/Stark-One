# STARK-0108 on the production image, through App Test: the demo worker
# reports progress and is joined BEFORE on_stop (`app: worker … joined` then
# `app: stop`); a fault raised on the UI task, then one raised by the worker,
# each unwind to the launcher with an "App stopped" alert; a worker that
# ignores the stop request hits the join timeout and the app still stops.
name = "emu-v01-app-lifecycle"
end_ms = 8550
heap_min = 200000
presses = [
    { key = "DOWN", at_ms = 300, hold_ms = 60 },
    { key = "DOWN", at_ms = 450, hold_ms = 60 },
    { key = "DOWN", at_ms = 600, hold_ms = 60 },
    { key = "OK", at_ms = 750, hold_ms = 60 },
    { key = "DOWN", at_ms = 950, hold_ms = 60 },
    { key = "DOWN", at_ms = 1150, hold_ms = 60 },
    { key = "OK", at_ms = 1350, hold_ms = 60 },
    { key = "BACK", at_ms = 2150, hold_ms = 60 },
    { key = "OK", at_ms = 2450, hold_ms = 60 },
    { key = "DOWN", at_ms = 2650, hold_ms = 60 },
    { key = "DOWN", at_ms = 2850, hold_ms = 60 },
    { key = "DOWN", at_ms = 3050, hold_ms = 60 },
    { key = "OK", at_ms = 3250, hold_ms = 60 },
    { key = "OK", at_ms = 3550, hold_ms = 60 },
    { key = "OK", at_ms = 3850, hold_ms = 60 },
    { key = "DOWN", at_ms = 4050, hold_ms = 60 },
    { key = "DOWN", at_ms = 4250, hold_ms = 60 },
    { key = "DOWN", at_ms = 4450, hold_ms = 60 },
    { key = "DOWN", at_ms = 4650, hold_ms = 60 },
    { key = "OK", at_ms = 4850, hold_ms = 60 },
    { key = "OK", at_ms = 5150, hold_ms = 60 },
    { key = "OK", at_ms = 5450, hold_ms = 60 },
    { key = "DOWN", at_ms = 5650, hold_ms = 60 },
    { key = "DOWN", at_ms = 5850, hold_ms = 60 },
    { key = "DOWN", at_ms = 6050, hold_ms = 60 },
    { key = "DOWN", at_ms = 6250, hold_ms = 60 },
    { key = "DOWN", at_ms = 6450, hold_ms = 60 },
    { key = "OK", at_ms = 6650, hold_ms = 60 },
    { key = "BACK", at_ms = 6950, hold_ms = 60 },
]
expect = [
    'menu: sel=5 "App Test"',
    "app: start apptest",
    'menu: sel=2 "Worker demo"',
    "apptest: worker started: demo",
    "apptest: worker n=1",
    "apptest: worker n=2",
    "apptest: worker n=3",
    "app: worker apptest joined",
    "app: stop apptest",
    "app: start apptest",
    'menu: sel=3 "Fail"',
    "app: fault apptest: I/O error",
    "app: stop apptest",
    'dialog: open "App stopped"',
    "dialog: ok",
    "app: start apptest",
    'menu: sel=4 "Fail from worker"',
    "apptest: worker started: fail",
    "app: fault apptest: Timeout",
    "app: worker apptest joined",
    "app: stop apptest",
    'dialog: open "App stopped"',
    "dialog: ok",
    "app: start apptest",
    'menu: sel=5 "Worker ignores stop"',
    "apptest: worker started: ignore-stop",
    "app: worker apptest join timeout",
    "app: stop apptest",
]
