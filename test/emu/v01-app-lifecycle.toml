# STARK-0108 on the production image, through App Test: the demo worker
# reports progress and is joined BEFORE on_stop (`app: worker … joined` then
# `app: stop`); a fault raised on the UI task, then one raised by the worker,
# each unwind to the launcher with an "App stopped" alert; a worker that
# ignores the stop request hits the join timeout and the app still stops.
name = "emu-v01-app-lifecycle"
end_ms = 8400
heap_min = 200000
presses = [
    { key = "DOWN", at_ms = 400, hold_ms = 60 },
    { key = "OK", at_ms = 600, hold_ms = 60 },
    { key = "DOWN", at_ms = 800, hold_ms = 60 },
    { key = "DOWN", at_ms = 1000, hold_ms = 60 },
    { key = "OK", at_ms = 1200, hold_ms = 60 },
    { key = "BACK", at_ms = 2000, hold_ms = 60 },
    { key = "OK", at_ms = 2300, hold_ms = 60 },
    { key = "DOWN", at_ms = 2500, hold_ms = 60 },
    { key = "DOWN", at_ms = 2700, hold_ms = 60 },
    { key = "DOWN", at_ms = 2900, hold_ms = 60 },
    { key = "OK", at_ms = 3100, hold_ms = 60 },
    { key = "OK", at_ms = 3400, hold_ms = 60 },
    { key = "OK", at_ms = 3700, hold_ms = 60 },
    { key = "DOWN", at_ms = 3900, hold_ms = 60 },
    { key = "DOWN", at_ms = 4100, hold_ms = 60 },
    { key = "DOWN", at_ms = 4300, hold_ms = 60 },
    { key = "DOWN", at_ms = 4500, hold_ms = 60 },
    { key = "OK", at_ms = 4700, hold_ms = 60 },
    { key = "OK", at_ms = 5000, hold_ms = 60 },
    { key = "OK", at_ms = 5300, hold_ms = 60 },
    { key = "DOWN", at_ms = 5500, hold_ms = 60 },
    { key = "DOWN", at_ms = 5700, hold_ms = 60 },
    { key = "DOWN", at_ms = 5900, hold_ms = 60 },
    { key = "DOWN", at_ms = 6100, hold_ms = 60 },
    { key = "DOWN", at_ms = 6300, hold_ms = 60 },
    { key = "OK", at_ms = 6500, hold_ms = 60 },
    { key = "BACK", at_ms = 6800, hold_ms = 60 },
]
expect = [
    'menu: sel=3 "App Test"',
    "app: start apptest",
    'menu: sel=2 "Worker demo"',
    "apptest: worker started: demo",
    "apptest: worker n=1",
    "apptest: worker n=2",
    "apptest: worker n=3",
    "app: worker apptest joined",
    "app: stop apptest",
    "app: start apptest",
    'menu: sel=3 "Fail"',
    "app: fault apptest: I/O error",
    "app: stop apptest",
    'dialog: open "App stopped"',
    "dialog: ok",
    "app: start apptest",
    'menu: sel=4 "Fail from worker"',
    "apptest: worker started: fail",
    "app: fault apptest: Timeout",
    "app: worker apptest joined",
    "app: stop apptest",
    'dialog: open "App stopped"',
    "dialog: ok",
    "app: start apptest",
    'menu: sel=5 "Worker ignores stop"',
    "apptest: worker started: ignore-stop",
    "app: worker apptest join timeout",
    "app: stop apptest",
]
