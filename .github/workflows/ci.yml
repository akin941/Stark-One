# STARK-0004/0005/0006: CI pipeline.
#
#   lint      — clang-format --check + check.sh + check_layers.py (STARK-0100) + check_pins.py + check_caps.py (STARK-0902)
#               + gitleaks (STARK-0004/0006)
#   firmware  — idf.py build (pinned espressif/idf image) + idf.py size (STARK-0004)
#   host      — scripts/test_host.sh on ubuntu-latest + macos-latest (STARK-0005)
#   esp-emulator — Tier 3: the built firmware runs in Espressif's pinned,
#               SHA-256-verified esp-emulator (scripts/test_emu.sh,
#               test/emu/*.toml): free, local, no account, no quota. Mandatory.
#   emu-storage-image — builds the emulator storage test image once (ADR-0018):
#               the same firmware with only stark_storage_medium (internal-flash
#               FAT) and four hardware transports (NFC, module bus, Sub-GHz,
#               lab) replaced by test-only fakes; check_emu_image.py proves that against the
#               production build; the image is uploaded for the jobs below.
#   esp-emulator-storage-shard — test/emu/storage/*.toml on that image, as a matrix of
#               four shards (STARK-0708). scripts/emu_shards.py partitions the list
#               deterministically (longest first by emulated duration) and proves every
#               scenario is in exactly one shard; scripts/test_emu_shards.py checks the same
#               in the lint job. No scenario is dropped or weakened: the shards together are
#               the whole set that used to run serially in about an hour.
#   esp-emulator-storage — the required check: succeeds only when every shard did, so the
#               name branch protection knows is unchanged.
#   esp-emulator-soak-run — the soaks (test/emu/soak/), one matrix entry each: V0.1 on the
#               production image, V0.2 to V0.7 (STARK-0207, 0307, 0405, 0505, 0606, 0708;
#               V0.3/V0.4 with the RMT loopback, V0.4 with the fake PN532 transport, V0.5
#               with the fake 24C02, V0.6 with the fake CC1101, V0.7 with the fake lab
#               transport) on the storage test image; pull requests and manual dispatch.
#   esp-emulator-soak — the required check for the soaks (pull requests): succeeds only
#               when every soak entry did.
#
# Every job above is free and mandatory. Wokwi is optional and lives in
# .github/workflows/wokwi.yml (manual dispatch or the `wokwi` PR label); it is
# never a required check (ADR-0017, docs/VALIDATION.md).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    # NOTE: pinned, not ubuntu-latest. clang-format's output changes between major
    # versions; 24.04 ships 18.x, the same as the stark-fmt image used locally. On
    # ubuntu-latest (26.04, clang-format 21) an untouched file failed the check.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install clang-format and clang-tidy
        run: sudo apt-get update -qq && sudo apt-get install -y clang-format clang-tidy && clang-format --version && clang-tidy --version

      - name: clang-format --check
        run: scripts/fmt.sh --check

      - name: clang-tidy (scripts/tidy.sh, pure cores)
        run: scripts/tidy.sh

      - name: Repository static checks (scripts/check.sh)
        run: bash scripts/check.sh

      - name: check_layers.py
        run: python3 scripts/check_layers.py

      - name: check_pins.py
        run: python3 scripts/check_pins.py

      - name: check_caps.py
        run: python3 scripts/check_caps.py

      - name: IR test vectors up to date (scripts/gen_ir_vectors.py --check)
        run: python3 scripts/gen_ir_vectors.py --check

      - name: NFC test vectors are current (STARK-0401)
        run: python3 scripts/gen_nfc_vectors.py --check
      - name: Module vectors are current
        run: python3 scripts/gen_module_vectors.py --check
      - name: Sub-GHz scenes and decoder vectors are current (STARK-0603, STARK-0604)
        run: python3 scripts/gen_subghz_vectors.py --check
      - name: Lab measurement vectors are current (STARK-0703)
        run: python3 scripts/gen_lab_vectors.py --check

      - name: Script unit tests (emulator harness, Wokwi gate)
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  firmware:
    name: firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: idf.py build + merge-bin (pinned espressif/idf Docker image)
        run: scripts/build.sh --docker

      - name: idf.py size
        run: |
          IDF_TAG="$(tr -d '[:space:]' < .idf-version)"
          docker run --rm \
            -v "$PWD:/p" -w /p \
            "espressif/idf:${IDF_TAG}" \
            idf.py size | tee size-report.txt

      - name: Verify dependencies.lock unchanged
        run: |
          if git status --porcelain -- dependencies.lock | grep -q .; then
            echo "::error::dependencies.lock changed during the build — commit the update explicitly."
            git diff -- dependencies.lock
            exit 1
          fi

      - name: Upload firmware for the emulator job
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-firmware
          path: |
            build/flasher_args.json
            build/project_description.json
            build/config/sdkconfig.json
            build/merged-binary.bin
            build/stark-one.bin
            build/stark-one.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error

      - name: Upload size report
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-size-report
          path: size-report.txt
          if-no-files-found: error

  host:
    name: host
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: scripts/test_host.sh
        if: matrix.os != 'ubuntu-latest'
        run: scripts/test_host.sh

      - name: scripts/test_host.sh --coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m venv /tmp/gcovr-venv
          /tmp/gcovr-venv/bin/pip install --quiet gcovr
          export PATH="/tmp/gcovr-venv/bin:$PATH"
          scripts/test_host.sh --coverage

      # STARK-0013: a failing graphics test dumps its surface to <test>.ppm.
      - name: Upload graphics failure dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-gfx-dumps-${{ matrix.os }}
          path: build-host/*.ppm
          if-no-files-found: ignore

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-host-coverage
          path: build-host/coverage.xml
          if-no-files-found: error

  esp-emulator:
    name: esp-emulator
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          name: stark-one-firmware
          path: build

      # scripts/test_emu.sh installs the esp-emu build pinned in
      # scripts/esp_emu.lock (SHA-256 verified before extraction) and runs
      # the scenarios inside the pinned espressif/idf image, which provides
      # the Xtensa GDB used to inject key presses.
      - name: scripts/test_emu.sh
        run: scripts/test_emu.sh

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-emu-logs
          path: build/emu/
          if-no-files-found: ignore

  emu-storage-image:
    name: emu-storage-image
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the production build (for the comparison)
        uses: actions/download-artifact@v8
        with:
          name: stark-one-firmware
          path: build

      - name: Build the emulator storage test image (pinned espressif/idf Docker image)
        run: scripts/build.sh --docker --emu-storage

      - name: Verify the test image's dependencies.lock unchanged
        run: |
          if git status --porcelain -- test/emu/storage_image/dependencies.lock | grep -q .; then
            echo "::error::test/emu/storage_image/dependencies.lock changed during the build."
            git diff -- test/emu/storage_image/dependencies.lock
            exit 1
          fi

      - name: check_emu_image.py (only the five allowed substitutions differ)
        run: python3 scripts/check_emu_image.py

      - name: The scenario shards cover the whole storage set exactly once
        run: python3 scripts/emu_shards.py --image storage --shards 4 --check

      - name: Upload the test image for the emulator jobs
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-emu-storage-image
          path: |
            build/emu-storage/merged-binary.bin
            build/emu-storage/stark-one-emu-storage.elf
          retention-days: 3
          if-no-files-found: error

  esp-emulator-storage-shard:
    name: esp-emulator-storage-shard (${{ matrix.shard }})
    needs: emu-storage-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the storage test image
        uses: actions/download-artifact@v8
        with:
          name: stark-one-emu-storage-image
          path: build/emu-storage

      - name: scripts/test_emu.sh --image storage (this shard's scenarios)
        run: |
          mapfile -t SCENARIOS < <(python3 scripts/emu_shards.py --image storage --shards 4 --index ${{ matrix.shard }})
          printf 'shard ${{ matrix.shard }} of 4: %s scenarios\n' "${#SCENARIOS[@]}"
          scripts/test_emu.sh --image storage "${SCENARIOS[@]}"

      - name: Upload storage emulator logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-emu-storage-logs-${{ matrix.shard }}
          path: build/emu/
          if-no-files-found: ignore

  esp-emulator-storage:
    name: esp-emulator-storage
    if: always()
    needs: [emu-storage-image, esp-emulator-storage-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: |
          echo "image build: ${{ needs.emu-storage-image.result }}, shards: ${{ needs.esp-emulator-storage-shard.result }}"
          test "${{ needs.emu-storage-image.result }}" = success
          test "${{ needs.esp-emulator-storage-shard.result }}" = success

  esp-emulator-soak-run:
    name: esp-emulator-soak-run (${{ matrix.soak }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: [firmware, emu-storage-image]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - soak: v01
            image: production
          - soak: v02
            image: storage
          - soak: v03
            image: storage
          - soak: v04
            image: storage
          - soak: v05
            image: storage
          - soak: v06
            image: storage
          - soak: v07
            image: storage
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download firmware
        if: matrix.image == 'production'
        uses: actions/download-artifact@v8
        with:
          name: stark-one-firmware
          path: build

      - name: Download the storage test image
        if: matrix.image == 'storage'
        uses: actions/download-artifact@v8
        with:
          name: stark-one-emu-storage-image
          path: build/emu-storage

      # ROADMAP V0.1 exit 3 (v01), STARK-0207, 0307, 0405, 0505, 0606, 0708.
      - name: scripts/test_emu.sh (soak ${{ matrix.soak }})
        run: |
          if [ "${{ matrix.image }}" = production ]; then
            scripts/test_emu.sh test/emu/soak/${{ matrix.soak }}-soak.toml
          else
            scripts/test_emu.sh --image storage test/emu/soak/${{ matrix.soak }}-soak.toml
          fi

      - name: Upload soak logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-emu-soak-logs-${{ matrix.soak }}
          path: build/emu/
          if-no-files-found: ignore

  esp-emulator-soak:
    name: esp-emulator-soak
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    needs: esp-emulator-soak-run
    runs-on: ubuntu-latest
    steps:
      - name: Every soak passed
        run: |
          echo "soaks: ${{ needs.esp-emulator-soak-run.result }}"
          test "${{ needs.esp-emulator-soak-run.result }}" = success
