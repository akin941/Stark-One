# STARK-0004/0005/0006: CI pipeline.
#
#   lint      — clang-format --check + check_layers.py (STARK-0100) + check_pins.py
#               + gitleaks (STARK-0004/0006)
#   firmware  — idf.py build (pinned espressif/idf image) + idf.py size (STARK-0004)
#   host      — scripts/test_host.sh on ubuntu-latest + macos-latest (STARK-0005)
#   esp-emulator — Tier 3: the built firmware runs in Espressif's pinned,
#               SHA-256-verified esp-emulator (scripts/test_emu.sh,
#               test/emu/*.toml): free, local, no account, no quota. Mandatory.
#   esp-emulator-soak — the 60 s soak (test/emu/soak/, ROADMAP V0.1 exit 3):
#               pull requests and manual dispatch; mandatory on pull requests.
#
# Every job above is free and mandatory. Wokwi is optional and lives in
# .github/workflows/wokwi.yml (manual dispatch or the `wokwi` PR label); it is
# never a required check (ADR-0017, docs/VALIDATION.md).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y clang-format

      - name: clang-format --check
        run: scripts/fmt.sh --check

      - name: check_layers.py
        run: python3 scripts/check_layers.py

      - name: check_pins.py
        run: python3 scripts/check_pins.py

      - name: Script unit tests (emulator harness, Wokwi gate)
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  firmware:
    name: firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: idf.py build + merge-bin (pinned espressif/idf Docker image)
        run: scripts/build.sh --docker

      - name: idf.py size
        run: |
          IDF_TAG="$(tr -d '[:space:]' < .idf-version)"
          docker run --rm \
            -v "$PWD:/p" -w /p \
            "espressif/idf:${IDF_TAG}" \
            idf.py size | tee size-report.txt

      - name: Verify dependencies.lock unchanged
        run: |
          if git status --porcelain -- dependencies.lock | grep -q .; then
            echo "::error::dependencies.lock changed during the build — commit the update explicitly."
            git diff -- dependencies.lock
            exit 1
          fi

      - name: Upload firmware for the emulator job
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-firmware
          path: |
            build/flasher_args.json
            build/merged-binary.bin
            build/stark-one.bin
            build/stark-one.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error

      - name: Upload size report
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-size-report
          path: size-report.txt
          if-no-files-found: error

  host:
    name: host
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: scripts/test_host.sh
        if: matrix.os != 'ubuntu-latest'
        run: scripts/test_host.sh

      - name: scripts/test_host.sh --coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m venv /tmp/gcovr-venv
          /tmp/gcovr-venv/bin/pip install --quiet gcovr
          export PATH="/tmp/gcovr-venv/bin:$PATH"
          scripts/test_host.sh --coverage

      # STARK-0013: a failing graphics test dumps its surface to <test>.ppm.
      - name: Upload graphics failure dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-gfx-dumps-${{ matrix.os }}
          path: build-host/*.ppm
          if-no-files-found: ignore

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-host-coverage
          path: build-host/coverage.xml
          if-no-files-found: error

  esp-emulator:
    name: esp-emulator
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          name: stark-one-firmware
          path: build

      # scripts/test_emu.sh installs the esp-emu build pinned in
      # scripts/esp_emu.lock (SHA-256 verified before extraction) and runs
      # the scenarios inside the pinned espressif/idf image, which provides
      # the Xtensa GDB used to inject key presses.
      - name: scripts/test_emu.sh
        run: scripts/test_emu.sh

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-emu-logs
          path: build/emu/
          if-no-files-found: ignore

  esp-emulator-soak:
    name: esp-emulator-soak
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          name: stark-one-firmware
          path: build

      - name: scripts/test_emu.sh (60 s soak, ROADMAP V0.1 exit 3)
        run: scripts/test_emu.sh test/emu/soak/v01-soak.toml

      - name: Upload soak logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-emu-soak-logs
          path: build/emu/
          if-no-files-found: ignore
