# STARK-0004/0005/0006: CI pipeline.
#
#   lint      — clang-format --check + check_pins.py + gitleaks (STARK-0004/0006)
#   firmware  — idf.py build (pinned espressif/idf image) + idf.py size (STARK-0004)
#   host      — scripts/test_host.sh on ubuntu-latest + macos-latest (STARK-0005)
#   wokwi     — scripts/test_wokwi.sh on the firmware job's build (STARK-0021):
#               the full scenario set on pull requests, v0-boot only on push
#               (Wokwi CI minutes are quota-limited, TESTING.md §4). Needs the
#               repository secret WOKWI_CLI_TOKEN.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y clang-format

      - name: clang-format --check
        run: scripts/fmt.sh --check

      - name: check_pins.py
        run: python3 scripts/check_pins.py

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  firmware:
    name: firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: idf.py build (pinned espressif/idf Docker image)
        run: scripts/build.sh --docker

      - name: idf.py size
        run: |
          IDF_TAG="$(tr -d '[:space:]' < .idf-version)"
          docker run --rm \
            -v "$PWD:/p" -w /p \
            "espressif/idf:${IDF_TAG}" \
            idf.py size | tee size-report.txt

      - name: Verify dependencies.lock unchanged
        run: |
          if git status --porcelain -- dependencies.lock | grep -q .; then
            echo "::error::dependencies.lock changed during the build — commit the update explicitly."
            git diff -- dependencies.lock
            exit 1
          fi

      - name: Upload firmware for the Wokwi job
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-firmware
          path: |
            build/flasher_args.json
            build/stark-one.bin
            build/stark-one.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error

      - name: Upload size report
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-size-report
          path: size-report.txt
          if-no-files-found: error

  host:
    name: host
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: scripts/test_host.sh
        if: matrix.os != 'ubuntu-latest'
        run: scripts/test_host.sh

      - name: scripts/test_host.sh --coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m venv /tmp/gcovr-venv
          /tmp/gcovr-venv/bin/pip install --quiet gcovr
          export PATH="/tmp/gcovr-venv/bin:$PATH"
          scripts/test_host.sh --coverage

      # STARK-0013: a failing graphics test dumps its surface to <test>.ppm.
      - name: Upload graphics failure dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-gfx-dumps-${{ matrix.os }}
          path: build-host/*.ppm
          if-no-files-found: ignore

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-host-coverage
          path: build-host/coverage.xml
          if-no-files-found: error

  wokwi:
    name: wokwi
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          name: stark-one-firmware
          path: build

      - name: Install wokwi-cli (pinned v0.27.1, sha256-verified)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/wokwi-cli" \
            https://github.com/wokwi/wokwi-cli/releases/download/v0.27.1/wokwi-cli-linuxstatic-x64
          echo "c3faa32b752c63762a9e4852288f0ce26952475ade16c95ebb8f61a272425633  $HOME/.local/bin/wokwi-cli" \
            | sha256sum -c -
          chmod +x "$HOME/.local/bin/wokwi-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: scripts/test_wokwi.sh
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            scripts/test_wokwi.sh
          else
            scripts/test_wokwi.sh test/scenarios/v0-boot.yaml
          fi

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stark-one-wokwi-logs
          path: build/wokwi/*.log
          if-no-files-found: ignore
